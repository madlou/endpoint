version: "3.8"

services:
  webhook-monitor:
    build: .
    volumes:
      - webhook-logs:/app/logs
    restart: unless-stopped
    environment:
      - TZ=UTC

volumes:
  webhook-logs:

  nginx:
    image: nginx:alpine
    ports:
      - "5050:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webhook-monitor
    restart: unless-stopped
